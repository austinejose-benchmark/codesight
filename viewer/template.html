<style>
:root{
  --ground:#e9edee;--surface:#ffffff;--surface-2:#f4f7f8;--surface-3:#eaeff1;
  --ink:#111a1d;--ink-soft:#48565c;--ink-faint:#78878d;--line:#d3dbde;--line-soft:#e2e8ea;
  --accent:#b8632b;--accent-ink:#8f4a1d;--accent-fill:rgba(184,99,43,.10);--accent-glow:rgba(184,99,43,.30);

  --k-code:#3a6ea5;--k-test:#2f8f6b;--k-infra:#b8632b;--k-stage:var(--accent);--k-ov:var(--accent);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1315;--surface:#141d21;--surface-2:#1a242a;--surface-3:#202c32;
  --ink:#e5edf0;--ink-soft:#9aabb2;--ink-faint:#6b7c83;--line:#26333a;--line-soft:#1e2a30;
  --accent:#e28a4e;--accent-ink:#f0a878;--accent-fill:rgba(226,138,78,.13);--accent-glow:rgba(226,138,78,.36);
  --k-file:#6fa6d8;--k-fn:#5fc39a;--k-class:#a892e6;--k-domain:#b28ce0;--k-store:#5cc0d3;--k-flow:#d4a94e;--k-step:#c6b163;--k-tool:#d98cc0;--k-concern:#e0857f;
  --k-code:#6fa6d8;--k-test:#5fc39a;--k-infra:#e28a4e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0d1315;--surface:#141d21;--surface-2:#1a242a;--surface-3:#202c32;
  --ink:#e5edf0;--ink-soft:#9aabb2;--ink-faint:#6b7c83;--line:#26333a;--line-soft:#1e2a30;
  --accent:#e28a4e;--accent-ink:#f0a878;--accent-fill:rgba(226,138,78,.13);--accent-glow:rgba(226,138,78,.36);
  --k-file:#6fa6d8;--k-fn:#5fc39a;--k-class:#a892e6;--k-domain:#b28ce0;--k-store:#5cc0d3;--k-flow:#d4a94e;--k-step:#c6b163;--k-tool:#d98cc0;--k-concern:#e0857f;
  --k-code:#6fa6d8;--k-test:#5fc39a;--k-infra:#e28a4e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{margin:0;text-wrap:balance}button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}::selection{background:var(--accent-glow)}
.mono{font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace}
.app{max-width:1200px;margin:0 auto;padding:22px clamp(14px,3vw,30px) 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.brand h1{font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.brand .sub{color:var(--ink-soft);font-size:13.5px}.brand .sub .mono{color:var(--ink-faint);font-size:12.5px}
.themebtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;display:flex;gap:7px;align-items:center;color:var(--ink-soft)}
.themebtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:clamp(16px,2.4vw,28px);align-items:start}
.rail{position:sticky;top:18px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 36px);overflow-y:auto}
.sec-h{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px 4px}
.railsec{display:flex;flex-direction:column;gap:2px}
.track{position:relative}
.track .line{position:absolute;left:23px;top:16px;bottom:16px;width:2px;background:var(--line);border-radius:2px}
.track .fill{position:absolute;left:23px;top:16px;width:2px;height:0;background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent-glow);transition:height .4s cubic-bezier(.4,0,.2,1)}
.station{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--radius-sm);z-index:1}
.station:hover{background:var(--surface-2)}.station:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.station .dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--ink-faint)}
.station .dot i{width:9px;height:9px;border-radius:50%}
.station.active{background:var(--accent-fill)}.station.active .dot{border-color:var(--accent);background:var(--accent);color:#fff}
.station.active .dot i{background:#fff}
.st-body{min-width:0;display:flex;flex-direction:column}
.st-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-title.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.station.active .st-title{color:var(--accent-ink)}
.st-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:440px;overflow:hidden;scroll-margin-top:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);font-size:12.5px}
.crumb{font-family:"IBM Plex Mono",monospace;background:none;border:0;padding:3px 6px;border-radius:5px;color:var(--ink-soft);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--surface-3);color:var(--accent-ink)}.crumb.here{color:var(--ink);font-weight:500}.crumb-sep{color:var(--ink-faint);font-size:11px}
.pbody{padding:18px clamp(16px,2vw,24px) 26px}
.mermaid-holder{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px 16px;text-align:center;min-height:120px}
.mermaid-holder svg{max-width:100%;height:auto}.diag-loading,.diag-err{color:var(--ink-faint);font-size:13px;padding:24px}
.flownav{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft)}
.fnav{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:48%;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 14px}
.fnav:hover{border-color:var(--accent);background:var(--surface-3)}
.fnav.next{margin-left:auto;text-align:right;align-items:flex-end}
.fnav-dir{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.fnav-t{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fnav:hover .fnav-t{color:var(--accent-ink)}
.kindtag{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid transparent}
.kindtag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.kt-ov,.kt-area,.kt-stage{color:var(--accent-ink);background:var(--accent-fill);border-color:var(--accent-glow)}
.kt-file{color:var(--k-file);background:color-mix(in srgb,var(--k-file) 12%,transparent)}
.kt-function{color:var(--k-fn);background:color-mix(in srgb,var(--k-fn) 12%,transparent)}
.kt-class{color:var(--k-class);background:color-mix(in srgb,var(--k-class) 12%,transparent)}
.kt-domain{color:var(--k-domain);background:color-mix(in srgb,var(--k-domain) 12%,transparent)}
.kt-flow{color:var(--k-flow);background:color-mix(in srgb,var(--k-flow) 12%,transparent)}
.kt-tool{color:var(--k-tool);background:color-mix(in srgb,var(--k-tool) 12%,transparent)}
.kt-concern{color:var(--k-concern);background:color-mix(in srgb,var(--k-concern) 12%,transparent)}
.kt-store{color:var(--k-store);background:color-mix(in srgb,var(--k-store) 12%,transparent)}
.kt-infra{color:var(--k-infra);background:color-mix(in srgb,var(--k-infra) 12%,transparent)}
.detail-head{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.detail-title{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.15;word-break:break-word}
.detail-title.mono{font-size:17px;font-family:"IBM Plex Mono",monospace}
.path{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);word-break:break-all}.path .ln{color:var(--accent-ink)}
.ghlink{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;text-decoration:none;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:4px 9px;width:fit-content;background:var(--surface-2)}
.ghlink:hover{border-color:var(--accent);color:var(--accent-ink)}
.summary{color:var(--ink-soft);font-size:14.5px;max-width:66ch;margin-top:4px}
.summary.empty{color:var(--ink-faint);font-style:italic}
.notes{margin-top:12px;padding:11px 14px;border-left:2px solid var(--accent);background:var(--accent-fill);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.meta-block{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.meta-row .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:4px}
.meta-row ul{margin:0;padding-left:17px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.meta-row li::marker{color:var(--accent)}
.section{margin-top:24px}
.section-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.section-h h3{font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);background:var(--surface-2);border-radius:20px;padding:1px 8px}
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:11px 13px}
.item:hover{border-color:var(--accent);background:var(--surface-3)}.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item.leaf,.item.leaf:hover{cursor:default;border-color:var(--line-soft);background:var(--surface-2)}
.item-marker{flex:none;width:9px;height:9px;border-radius:50%}
.m-file{background:var(--k-file)}.m-function{background:var(--k-fn)}.m-class{background:var(--k-class)}
.m-domain{background:var(--k-domain)}.m-flow{background:var(--k-flow)}.m-step{background:var(--k-step)}.m-tool{background:var(--k-tool)}.m-concern{background:var(--k-concern)}
.m-stage{background:var(--accent)}.m-store{background:var(--k-store)}.m-infra{background:var(--k-infra)}
.item-main{min-width:0;flex:1}
.item-name{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-name.sans{font-family:"IBM Plex Sans",sans-serif}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-ln{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
.item-chev{flex:none;color:var(--ink-faint)}.item:hover .item-chev{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:6px;padding:4px 9px;color:var(--ink-soft)}
button.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.badge{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent-ink);background:var(--accent-fill);border:1px solid var(--accent-glow);border-radius:20px;padding:3px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:20px}
.kpi{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .val{font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
/* live mode (codesight serve): agent-driven focus bar, highlights, code view, diagrams */
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.livepill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--surface)}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.livepill.on{color:var(--k-fn)}.livepill.on::before{background:var(--k-fn);box-shadow:0 0 6px var(--k-fn)}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-faint)}
.focus{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:var(--accent-fill)}
.focus-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.focus-lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-right:4px}
.focus-q{font-style:italic;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70ch}
.focus-x{margin-left:auto;background:none;border:0;color:var(--ink-faint);font-size:17px;line-height:1;padding:2px 6px}
.focus-x:hover{color:var(--accent-ink)}
.item.hl{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button.ghlink{cursor:pointer}
.codebox{position:relative;margin-top:16px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--surface-2);max-height:65vh;overflow:auto;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;padding:8px 0}
.codebox .cl{display:flex;white-space:pre;padding-right:14px}
.codebox .cn{flex:none;width:56px;padding-right:14px;text-align:right;color:var(--ink-faint);user-select:none}
.codebox .cl.on{background:var(--accent-fill)}.codebox .cl.on .cn{color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
.codebox .cc{color:var(--ink)}
/* a function / class starts on this line (tooltip names it) */
.codebox .cl.def .cn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--k-fn);margin-right:7px;vertical-align:1px}
.codebox .cl.def.cls .cn::before{background:var(--k-class)}
.code-more{margin-top:8px}
.codebox .gap{display:block;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);background:var(--surface-3);color:var(--ink-faint);font:inherit;font-size:11.5px;padding:3px 0 3px 70px;margin:2px 0}
.codebox .gap:hover{color:var(--accent-ink)}
/* syntax colours (highlight.js classes) from the page's own tokens, so both themes work */
.cc .hljs-keyword,.cc .hljs-selector-tag,.cc .hljs-built_in{color:var(--k-class)}
.cc .hljs-string,.cc .hljs-regexp,.cc .hljs-template-tag,.cc .hljs-addition{color:var(--k-fn)}
.cc .hljs-number,.cc .hljs-literal,.cc .hljs-symbol,.cc .hljs-bullet{color:var(--accent-ink)}
.cc .hljs-title,.cc .hljs-section,.cc .hljs-name{color:var(--k-file)}
.cc .hljs-type,.cc .hljs-title.class_{color:var(--k-store)}
.cc .hljs-comment,.cc .hljs-quote{color:var(--ink-faint);font-style:italic}
.cc .hljs-meta,.cc .hljs-attr,.cc .hljs-attribute,.cc .hljs-property,.cc .hljs-selector-class{color:var(--k-flow)}
.cc .hljs-deletion{color:var(--k-concern)}
.kt-diagram{color:var(--k-flow);background:color-mix(in srgb,var(--k-flow) 12%,transparent)}
.kt-step{color:var(--k-step);background:color-mix(in srgb,var(--k-step) 12%,transparent)}
/* search palette (Cmd+K or /) */
.pal{position:fixed;inset:0;background:rgba(10,16,18,.45);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;z-index:50}
.pal[hidden]{display:none}
.pal-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pal-in{width:100%;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:14px 16px;outline:none}
.pal-list{max-height:55vh;overflow-y:auto;padding:6px}
.pal-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius-sm);padding:8px 10px}
.pal-row.sel{background:var(--accent-fill)}
.pal-name{font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.pal-sub{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pal-kind{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
.pal-empty{padding:14px;color:var(--ink-faint);font-size:13px}
/* learner style (Text / Visual, Beginner / Developer) — see "learner" in the script */
.frame{display:flex;flex-direction:column}
.frame>.detail-head{order:-3}.frame>.simple-card{order:-2}
:root[data-style="visual"] .frame>.sec-diagram{order:-1}
:root[data-style="visual"] .frame>.sec-diagram .mermaid-holder{padding:26px 18px}
.diag-fold{display:flex;justify-content:center}
details.more{margin-top:14px}
details.more>summary,.simple-card>summary{cursor:pointer;list-style:none;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
details.more>summary::-webkit-details-marker,.simple-card>summary::-webkit-details-marker{display:none}
details.more>summary::before,.simple-card>summary::before{content:"+ ";color:var(--accent)}
details.more[open]>summary::before,.simple-card[open]>summary::before{content:"\2212  "}
.simple-card{margin-top:16px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--surface-2);padding:13px 16px}
.simple-card[open]{padding-bottom:16px}
.sc-analogy{margin-top:12px;font-size:17px;line-height:1.45;font-weight:500;color:var(--ink);max-width:62ch}
.sc-steps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:sc}
.sc-steps li{counter-increment:sc;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;font-size:13.5px;line-height:1.4;color:var(--ink-soft)}
.sc-steps li::before{content:counter(sc);align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-faint)}
.sc-ic{font-size:34px;line-height:1}
.chip.has{border-color:var(--accent-glow);color:var(--accent-ink)}
.chip.on{background:var(--accent-fill);border-color:var(--accent);color:var(--accent-ink)}
.draw-holder{margin-top:12px}
.draw-note{font-size:12.5px;color:var(--ink-faint);margin-top:8px}
.picker{padding:22px 22px 18px}
.picker h2{font-size:17px;font-weight:600;margin:0 0 4px}
.pk-sub{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
.pk-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.pk-opt{text-align:left;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.pk-opt:hover{border-color:var(--accent)}
.pk-opt b{font-size:14.5px;font-weight:600}
.pk-opt span{font-size:12.5px;color:var(--ink-soft)}
.pk-opt.on{border-color:var(--accent);background:var(--accent-fill)}.pk-opt.on b{color:var(--accent-ink)}
.pk-done{width:100%;border:0;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:11px}
@media (max-width:520px){.pk-row{grid-template-columns:1fr}}
/* learning path + quiz */
.frame>.path-cta{order:-2}
.path-cta{margin-top:16px;border:1px solid var(--accent-glow);background:var(--accent-fill);border-radius:var(--radius);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.path-cta .pc-t{font-weight:600;font-size:15px}.path-cta .pc-s{font-size:12.5px;color:var(--ink-soft)}
.path-cta .pc-main{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:120px}.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.btn-main{border:0;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;padding:9px 16px}
.btn-main:hover{filter:brightness(1.08)}.btn-main[disabled]{opacity:.6;cursor:default}
.keycode-why{font-size:13.5px;color:var(--ink-soft);margin:0 0 4px}
.sec-keycode .codebox{max-height:42vh} /* keep the quiz close below the code */
.quiz-q{margin-top:12px;padding:14px 16px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--surface-2)}
.quiz-q .qt{font-weight:600;font-size:14.5px;margin-bottom:10px;line-height:1.4}
.quiz-q .qsub{font-size:14px;color:var(--ink);margin:-4px 0 10px}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{text-align:left;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;line-height:1.4}
.qopt:hover:not([disabled]){border-color:var(--accent)}.qopt[disabled]{cursor:default}
.qopt.right{border-color:var(--k-fn);background:color-mix(in srgb,var(--k-fn) 13%,transparent)}
.qopt.wrong{border-color:var(--k-concern);background:color-mix(in srgb,var(--k-concern) 13%,transparent)}
.qres{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.qres .ok{color:var(--k-fn)}.qres .no{color:var(--k-concern)}.qres .mid{color:var(--accent-ink)}
.qres .chip{margin-top:6px}
.qmiss{margin:6px 0 0;padding-left:18px}.qmiss li::marker{color:var(--accent)}
textarea.qexplain{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
textarea.qexplain:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.qact{display:flex;gap:10px;align-items:center;margin-top:10px}.qact .hint{font-size:12px;color:var(--ink-faint)}
@media (max-width:780px){.layout{grid-template-columns:1fr}.rail{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="cs" type="application/json">__CODESIGHT_DATA__</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById("cs").textContent);
const LIVE=__CS_LIVE__; // true when served by `codesight serve` (agent-driven dashboard + code view)
// ---- learner: how this viewer likes to learn (saved per browser) ----
const LEARNER_KEY="codesight.learner",STYLES=["visual","text"],LEVELS=["beginner","developer"];
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem(LEARNER_KEY)||"null");
  if(p&&STYLES.includes(p.style)&&LEVELS.includes(p.level))return p; }catch{} return null; }
const savedPrefs=loadPrefs();
let prefs=savedPrefs||{style:"visual",level:"developer"},prefsChosen=Boolean(savedPrefs);
document.documentElement.dataset.style=prefs.style;document.documentElement.dataset.level=prefs.level;
// ---- learning path progress (per browser, per repo) ----
const PATH=DATA.hasArch?DATA.spine:[],PATH_KEY="codesight.path."+DATA.project.name,MIN_PER_STEP=3;
function loadPath(){ try{ const p=JSON.parse(localStorage.getItem(PATH_KEY)||"null"); if(p&&p.steps&&typeof p.steps==="object")return p; }catch{} return {steps:{},at:0}; }
let progress=loadPath();
const GIT=DATA.git||{};
const byPath=new Map(DATA.files.map(f=>[f.path,f]));
const byId=(arr)=>new Map((arr||[]).map(x=>[x.id,x]));
const stageById=byId(DATA.spine), domainById=byId(DATA.domains), storeById=byId(DATA.stores), infraById=byId(DATA.infra);
const toolById=byId(DATA.tools), concernById=byId(DATA.concerns);
const filesByArea=new Map();
for(const f of DATA.files){ if(!filesByArea.has(f.area))filesByArea.set(f.area,[]); filesByArea.get(f.area).push(f); }
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base=p=>p.split("/").pop();
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const kindTag=(k,l)=>'<span class="kindtag kt-'+k+'">'+(l||k)+'</span>';
function ghUrl(path,lr){ if(!GIT.base||!path)return null; let u=GIT.base+"/blob/"+(GIT.commit||GIT.branch||"main")+"/"+path;
  if(lr&&lr.length===2&&lr[0])u+="#L"+lr[0]+(lr[1]&&lr[1]!==lr[0]?"-L"+lr[1]:""); return u; }
function ghLink(path,lr){ const u=ghUrl(path,lr); if(!u)return "";
  return '<a class="ghlink" href="'+u+'" target="_blank" rel="noopener noreferrer"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.72-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>View on GitHub</a>'; }

document.getElementById("repo-name").textContent=DATA.project.name;
document.getElementById("repo-sub").innerHTML=(DATA.hasArch?'Follow the request flow, or drill any area to file &amp; function. ':'Explore areas → files → functions. ')+(GIT.commit?'<span class="mono">@'+esc(GIT.commit.slice(0,10))+'</span>':'');

// ---- rail ----
const rail=document.getElementById("rail");const clickables=[];let trackFill=null,trackStations=[];
const keyOf=t=>t.t+":"+(t.id||"");
function section(sec,items,track){
  const s=document.createElement("div");s.className="railsec";
  s.appendChild(el('<p class="sec-h">'+esc(sec)+'</p>'));
  const wrap=document.createElement("div");wrap.className=track?"track":"";
  if(track){wrap.appendChild(el('<div class="line"></div>'));const f=el('<div class="fill"></div>');wrap.appendChild(f);trackFill=f;}
  items.forEach(it=>{ const b=document.createElement("button");b.className="station";
    const dotInner=it.num!=null?String(it.num):'<i style="background:var(--k-'+(it.kind||"ov")+')"></i>';
    b.innerHTML='<span class="dot">'+dotInner+'</span><span class="st-body"><span class="st-title'+(it.mono?" mono":"")+'">'+esc(it.title)+'</span>'+(it.sub?'<span class="st-sub">'+esc(it.sub)+'</span>':"")+'</span>';
    b.addEventListener("click",()=>{clearAsk();open(it.target,it.title);});
    if(track)trackStations.push(b);
    clickables.push({key:keyOf(it.target),set:on=>b.classList.toggle("active",on)});
    wrap.appendChild(b); });
  s.appendChild(wrap);rail.appendChild(s);
}
section("Start",[{title:"Repository overview",sub:"the whole repo",target:{t:"overview"},kind:"ov"}]);
let pathSubEl=null; // "3 of 10 steps done" under the rail entry
if(PATH.length){ section("Learn",[{title:"Learning path",sub:" ",target:{t:"path",id:"0"},kind:"step"}]);pathSubEl=rail.lastChild.querySelector(".st-sub"); }
if(DATA.hasArch){
  section("Request flow",DATA.spine.map(s=>({title:s.title,num:s.n,target:{t:"stage",id:s.id},kind:"stage"})),true);
  if(DATA.tools.length) section("Tools",DATA.tools.map(t=>({title:t.name,sub:t.summary,target:{t:"tool",id:t.id},kind:"tool"})));
  if(DATA.domains.length) section("Domains",DATA.domains.map(d=>({title:d.name,sub:(d.files||[]).length+" files",target:{t:"domain",id:d.id},kind:"domain"})));
  if(DATA.concerns.length) section("Concerns",DATA.concerns.map(c=>({title:c.label,target:{t:"concern",id:c.id},kind:"concern"})));
  if(DATA.stores.length) section("Data stores",DATA.stores.map(s=>({title:s.label,sub:s.kind,target:{t:"store",id:s.id},kind:"store"})));
  if(DATA.infra.length) section("Infrastructure",DATA.infra.map(x=>({title:x.label,target:{t:"infra",id:x.id},kind:"infra"})));
}
section("All files",DATA.overview.areas.map(a=>({title:a.dir,sub:a.n+" files",target:{t:"area",id:a.dir},kind:a.kind,mono:true})));
function markActive(k){clickables.forEach(c=>c.set(c.key===k));paintTrace();}
function paintTrace(){ if(!trackFill)return; const idx=trackStations.findIndex(b=>b.classList.contains("active"));
  if(idx<0){trackFill.style.height="0";return;} const dot=trackStations[idx].querySelector(".dot");
  const top0=trackStations[0].getBoundingClientRect().top; const y=dot.getBoundingClientRect().top+dot.offsetHeight/2-top0-16;
  trackFill.style.height=Math.max(0,y)+"px"; }
window.addEventListener("resize",paintTrace);

// ---- panel ----
let stack=[],curDiags=[],hl=new Set(); // hl: files the agent's current answer is about
const crumbsEl=document.getElementById("crumbs"),pbody=document.getElementById("pbody"),panel=document.getElementById("panel");
function open(t,label){ markActive(keyOf(t.t==="path"?{t:"path",id:"0"}:t));
  const map={overview:"Overview",stage:"stage",domain:"domain",tool:"tool",concern:"concern",store:"store",infra:"infra",area:"area",file:"file"};
  stack=[{kind:t.t,ref:t.id,label:label||map[t.t]}]; render(true); }
function pushFrame(f){stack.push(f);render(false);}
function gotoCrumb(k){stack=stack.slice(0,k+1);render(false);}
function render(scroll){
  crumbsEl.hidden=stack.length===0;crumbsEl.innerHTML="";
  stack.forEach((f,i)=>{ if(i>0){const s=document.createElement("span");s.className="crumb-sep";s.textContent="›";crumbsEl.appendChild(s);}
    const c=document.createElement("button");c.className="crumb"+(i===stack.length-1?" here":"");c.textContent=f.label;
    if(i<stack.length-1)c.addEventListener("click",()=>gotoCrumb(i));crumbsEl.appendChild(c); });
  const frame=stack[stack.length-1];
  pbody.innerHTML="";curDiags=[];
  const node=renderFrame(frame);node.classList.add("frame");pbody.appendChild(node);
  if(scroll)panel.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function head(kind,kl,title,mono,path,summary,gh){ const h=document.createElement("div");h.className="detail-head";
  h.innerHTML=kindTag(kind,kl)+'<div class="detail-title'+(mono?" mono":"")+'">'+esc(title)+'</div>'+(path?'<div class="path">'+path+'</div>':"")+(gh||"")+
    (summary!==undefined?'<div class="summary'+(summary?"":" empty")+'">'+esc(summary||"No summary yet.")+'</div>':"");
  return h; }
function sectionEl(title,count){ const s=document.createElement("div");s.className="section";
  s.innerHTML='<div class="section-h"><h3>'+esc(title)+'</h3>'+(count!=null?'<span class="count">'+count+'</span>':"")+'</div>';
  const l=document.createElement("div");l.className="list";s.appendChild(l);s._list=l;return s; }
function item({kind,name,sub,ln,sans,onClick,leaf,path}){ const b=document.createElement("button");b.className="item"+(leaf?" leaf":"")+(path&&hl.has(path)?" hl":"");
  if(path)b.dataset.path=path;
  b.innerHTML='<span class="item-marker m-'+kind+'"></span><span class="item-main"><span class="item-name'+(sans?" sans":"")+'">'+esc(name)+'</span>'+(sub?'<span class="item-sub">'+esc(sub)+'</span>':"")+'</span>'+(ln?'<span class="item-ln">'+ln+'</span>':"")+(leaf?"":'<svg class="item-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>');
  if(onClick&&!leaf)b.addEventListener("click",onClick);return b; }
function fileRow(f,sub){ const nf=f.functions.length; return item({kind:"file",name:base(f.path),path:f.path,sub:sub!==undefined?sub:f.summary,ln:nf?nf+" fn":"",onClick:()=>pushFrame({kind:"file",ref:f.path,label:base(f.path)})}); }
function fileItem(f){ return fileRow(f); }
function filesSection(paths){ const s=sectionEl("Files",paths.length); paths.forEach(p=>{const f=byPath.get(p);if(f)s._list.appendChild(fileItem(f));}); return s; }
function metaBlock(rows){ const mb=document.createElement("div");mb.className="meta-block";
  rows.forEach(([lbl,arr])=>{ if(arr&&arr.length){const r=document.createElement("div");r.className="meta-row";
    r.innerHTML='<div class="lbl">'+esc(lbl)+'</div><ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';mb.appendChild(r);} });
  return mb.children.length?mb:null; }

function renderFrame(f){
  if(f.kind==="overview")return renderOverview();
  if(f.kind==="stage")return renderStage(stageById.get(f.ref));
  if(f.kind==="domain")return renderDomain(domainById.get(f.ref));
  if(f.kind==="tool")return renderTool(toolById.get(f.ref));
  if(f.kind==="concern")return renderConcern(concernById.get(f.ref));
  if(f.kind==="flow")return renderFlow(f.domainId,f.idx);
  if(f.kind==="store")return renderStore(storeById.get(f.ref));
  if(f.kind==="infra")return renderInfra(infraById.get(f.ref));
  if(f.kind==="area")return renderArea(f.ref);
  if(f.kind==="file")return renderFile(byPath.get(f.ref));
  if(f.kind==="function")return renderFunc(f.file,f.fn);
  if(f.kind==="code")return renderCode(f);
  if(f.kind==="diagram")return renderUserDiagram(userDiagrams[+f.ref]);
  if(f.kind==="path")return renderPath(+f.ref);
  return document.createElement("div");
}
function renderOverview(){
  const o=DATA.overview,w=document.createElement("div");
  const h=document.createElement("div");h.className="detail-head";
  h.innerHTML=kindTag("ov","Repository")+'<div class="detail-title">'+esc(o.name)+'</div>'+(o.description?'<div class="summary">'+esc(o.description)+'</div>':"")+ghLink("",null);
  const bd=document.createElement("div");bd.className="badges";o.badges.forEach(b=>bd.appendChild(el('<span class="badge">'+esc(b)+'</span>')));h.appendChild(bd);w.appendChild(h);
  if(PATH.length)w.appendChild(pathCta());
  const mb=metaBlock([["Non-negotiables",o.invariants]]);if(mb)w.appendChild(mb);
  const k=document.createElement("div");k.className="kpis";
  o.stats.forEach(s=>k.appendChild(el('<div class="kpi"><span class="val">'+esc(s.value)+'</span><span class="lab">'+esc(s.label)+'</span></div>')));w.appendChild(k);
  // Start here — entry points (files of the first request-flow stage).
  if(DATA.hasArch&&DATA.spine[0]&&(DATA.spine[0].files||[]).length){
    const eps=DATA.spine[0].files;const sec=sectionEl("Start here",eps.length);
    eps.forEach(p=>{const f=byPath.get(p);if(f)sec._list.appendChild(fileRow(f));});w.appendChild(sec); }
  // Read these first — internal files ranked by how many other files import them.
  const fanIn=new Map();
  DATA.files.forEach(f=>(f.imports||[]).forEach(ip=>{ if(byPath.has(ip)&&ip!==f.path)fanIn.set(ip,(fanIn.get(ip)||0)+1); }));
  const ranked=[...fanIn.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(ranked.length){ const sec=sectionEl("Read these first",ranked.length);
    ranked.forEach(([p,n])=>{const f=byPath.get(p);if(f)sec._list.appendChild(fileRow(f,n+(n===1?" file imports this":" files import this")+(f.summary?" · "+f.summary:"")));});w.appendChild(sec); }
  // Request flow — the high-level graph, inline (re-renders on theme toggle).
  if(DATA.diagram)w.appendChild(diagramSection("Request flow",DATA.diagram));
  if(DATA.tools.length){ const sec=sectionEl("Tools",DATA.tools.length);
    DATA.tools.forEach(t=>sec._list.appendChild(item({kind:"tool",name:t.name,sub:t.summary,sans:true,ln:(t.files||[]).length?(t.files.length+" files"):"",onClick:()=>open({t:"tool",id:t.id},t.name)})));w.appendChild(sec); }
  if(DATA.domains.length){ const sec=sectionEl("Domains",DATA.domains.length);
    DATA.domains.forEach(d=>sec._list.appendChild(item({kind:"domain",name:d.name,sub:d.summary,sans:true,ln:(d.files||[]).length+" files",onClick:()=>open({t:"domain",id:d.id},d.name)})));w.appendChild(sec); }
  if(o.languages&&o.languages.length){ const s2=sectionEl("Languages");const c=document.createElement("div");c.className="chips";
    o.languages.forEach(l=>c.appendChild(el('<span class="chip">'+esc(l)+'</span>')));s2.replaceChild(c,s2._list);w.appendChild(s2); }
  return w;
}
function renderStage(s){ const w=document.createElement("div");
  const hs=head("stage","Stage "+s.n,s.title,false,"",s.blurb);w.appendChild(hs);
  const pi=PATH.findIndex(x=>x.id===s.id);
  if(pi>=0&&quizOf(s)){ const b=el('<button class="ghlink">Quiz yourself on this stage</button>');b.addEventListener("click",()=>goStep(pi+1));hs.appendChild(b); }
  addLearning(w,"stage",s.id);
  if(s.diagram)w.appendChild(diagramSection("Stage flow",s.diagram));
  if(s.files&&s.files.length)w.appendChild(filesSection(s.files));
  addDraw(w,"stage",s.id);
  // Walk the request flow: previous / next stage, in-panel.
  const idx=DATA.spine.findIndex(x=>x.id===s.id);
  const prev=idx>0?DATA.spine[idx-1]:null, next=idx>=0&&idx<DATA.spine.length-1?DATA.spine[idx+1]:null;
  if(prev||next){ const nav=document.createElement("div");nav.className="flownav";

const pathDone=()=>PATH.filter(stepDone).length;
function paintPathRail(){ if(pathSubEl)pathSubEl.textContent=pathDone()+" of "+PATH.length+" steps done"; }
function pathBar(){ const b=el('<div class="pbar"><i></i></div>');b.firstChild.style.width=Math.round(100*pathDone()/Math.max(1,PATH.length))+"%";return b; }
const goStep=i=>open({t:"path",id:String(i)},"Learning path");
function nextStep(){ const i=PATH.findIndex(s=>!stepDone(s)); return i<0?PATH.length+1:i+1; }
function pathCta(){ const done=pathDone(),all=done>=PATH.length,c=document.createElement("div");c.className="path-cta";
  const main=el('<div class="pc-main"><div class="pc-t">'+(all?"You finished the learning path":done?"Continue the learning path":"Learn this repo in about "+PATH.length*MIN_PER_STEP+" minutes")+'</div><div class="pc-s">'+PATH.length+' steps through the request flow — a simple card, the diagram, the key code, and a short quiz each.</div></div>');
  main.appendChild(pathBar());c.appendChild(main);
  const b=el('<button class="btn-main">'+(all?"See your score":done?"Continue — step "+nextStep():"Start")+'</button>');
  b.addEventListener("click",()=>goStep(done?nextStep():1));c.appendChild(b);return c; }
function renderPath(i){ if(i<=0)return renderPathIntro(); if(i>PATH.length)return renderPathFinish(); return renderPathStep(i); }
function renderPathIntro(){ const w=document.createElement("div");
  const h=head("step","Learning path","Learn "+DATA.project.name,false,"","Walk the request flow from start to end. Each step has a simple card, the diagram, the key code, and a few questions. About "+PATH.length*MIN_PER_STEP+" minutes.");
  h.appendChild(pathBar());w.appendChild(h);
  const sec=sectionEl("Steps",PATH.length);
  PATH.forEach((s,i)=>{ const sc=stepScore(s),done=stepDone(s);
    const sub=done?("Done"+(sc?" · "+sc.right+" of "+sc.of+" right":"")):(progress.steps[s.id]&&progress.steps[s.id].seen?"Started":"Not started");
    sec._list.appendChild(item({kind:"step",name:(i+1)+". "+s.title,sub,sans:true,ln:done?"✓":"",onClick:()=>goStep(i+1)})); });
  w.appendChild(sec);
  const act=el('<div class="qact"></div>'),n=nextStep(),b=el('<button class="btn-main">'+(pathDone()?"Continue":"Start")+'</button>');
  b.addEventListener("click",()=>goStep(n>PATH.length?1:n));act.appendChild(b);w.appendChild(act);return w; }
function renderPathStep(i){ const s=PATH[i-1],q=quizOf(s),st=stepState(s.id),w=document.createElement("div");
  st.seen=true;progress.at=i;savePath();
  const h=head("step","Step "+i+" of "+PATH.length,s.title,false,"",s.blurb);h.appendChild(pathBar());w.appendChild(h);
  addLearning(w,"stage",s.id);
  if(s.diagram)w.appendChild(diagramSection("Stage flow",s.diagram));
  if(q&&q.keyCode&&byPath.has(q.keyCode.path)){ const kc=q.keyCode,sec=sectionEl("Key code · "+kc.name);sec.classList.add("sec-keycode");
    const body=document.createElement("div");sec.replaceChild(body,sec._list);
    if(kc.why)body.appendChild(el('<p class="keycode-why">'+esc(kc.why)+'</p>'));
    body.appendChild(el('<div class="path">'+esc(kc.path)+' <span class="ln">'+rangeLabel(kc.start,kc.end)+'</span></div>'));
    body.append(...codeView({file:kc.path,ranges:[[kc.start,kc.end]],whole:false}));
    w.appendChild(sec); }
  else if(s.files&&s.files.length)w.appendChild(filesSection(s.files));
  if(q){ const sec=sectionEl("Check yourself",q.questions.length+(q.open?1:0));
    q.questions.forEach((x,qi)=>sec._list.appendChild(mcqEl(s,qi,x)));
    if(q.open)sec._list.appendChild(openEl(s,q.open));
    w.appendChild(sec); }
  const nav=document.createElement("div");nav.className="flownav";
  const mk=(to,dir,title,cls)=>{ const b=document.createElement("button");b.className="fnav "+cls;
    b.innerHTML='<span class="fnav-dir">'+dir+'</span><span class="fnav-t">'+esc(title)+'</span>';b.addEventListener("click",()=>goStep(to));return b; };
  nav.appendChild(mk(i-1,"&larr; Previous",i>1?(i-1)+". "+PATH[i-2].title:"Introduction","prev"));
  nav.appendChild(mk(i+1,i<PATH.length?"Next step &rarr;":"Finish &rarr;",i<PATH.length?(i+1)+". "+PATH[i].title:"See your score","next"));
  w.appendChild(nav);return w; }
function mcqEl(s,qi,q){ const st=stepState(s.id);
  const box=el('<div class="quiz-q"><div class="qt">'+esc((qi+1)+". "+q.q)+'</div><div class="qopts"></div><div class="qres" hidden></div></div>');
  const opts=box.querySelector(".qopts"),res=box.querySelector(".qres");
  const reveal=p=>{ [...opts.children].forEach((b,i)=>{ b.disabled=true;if(i===q.answer)b.classList.add("right");else if(i===p)b.classList.add("wrong"); });
    const ok=p===q.answer;res.hidden=false;
    res.innerHTML='<b class="'+(ok?"ok":"no")+'">'+(ok?"Right.":"Not quite.")+'</b> '+esc(q.why[p]||"")+
      (ok?"":'<br>Right answer: <b>'+esc(q.options[q.answer])+'</b>'+(q.why[q.answer]?" — "+esc(q.why[q.answer]):""));
    if(q.cite&&byPath.has(q.cite)){ const b=el('<button class="chip">Show me in the code</button>');
      b.addEventListener("click",()=>pushFrame({kind:"file",ref:q.cite,label:base(q.cite)}));res.appendChild(document.createElement("br"));res.appendChild(b); } };
  q.options.forEach((o,i)=>{ const b=el('<button class="qopt">'+esc(o)+'</button>');
    b.addEventListener("click",()=>{ if(st.picks[qi]!=null)return; st.picks[qi]=i;savePath();reveal(i); });opts.appendChild(b); });
  if(st.picks[qi]!=null)reveal(st.picks[qi]);
  return box; }
// "Explain it back": Claude grades it against the stage's key points (needs `codesight serve`).
function openEl(s,open){ const st=stepState(s.id);
  const box=el('<div class="quiz-q"><div class="qt">Explain it back</div><div class="qsub">'+esc(open.q)+'</div><textarea class="qexplain" placeholder="In your own words — a few sentences is enough."></textarea><div class="qact"></div><div class="qres" hidden></div></div>');
  const ta=box.querySelector("textarea"),act=box.querySelector(".qact"),res=box.querySelector(".qres");
  if(st.open&&st.open.answer)ta.value=st.open.answer;
  const show=g=>{ res.hidden=false;const cls=g.score===g.of?"ok":g.score?"mid":"no";
    res.innerHTML='<b class="'+cls+'">'+g.score+' of '+g.of+' key points.</b> '+esc(g.feedback||"")+
      (g.missed&&g.missed.length?'<div style="margin-top:6px">Also worth knowing:</div><ul class="qmiss">'+g.missed.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul>':""); };
  if(LIVE){ const b=el('<button class="btn-main">Check my answer</button>');act.appendChild(b);act.appendChild(el('<span class="hint">⌘ + Enter</span>'));
    const check=()=>{ const answer=ta.value.trim(); if(!answer||b.disabled)return; b.disabled=true;b.textContent="Checking…";
      fetch("/api/grade",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({stage:s.id,answer})})
        .then(r=>r.json().then(j=>{ if(!r.ok)throw new Error(j.error||"could not check it");return j; }))
        .then(g=>{ st.open={answer,score:g.score,of:g.of,feedback:g.feedback,missed:g.missed};savePath();show(g); })
        .catch(e=>{ res.hidden=false;res.innerHTML='<span class="no">'+esc(e.message)+'</span>'; })
        .finally(()=>{ b.disabled=false;b.textContent="Check again"; }); };
    b.addEventListener("click",check);
    ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault();check(); } }); }
  else{ const b=el('<button class="ghlink">Show the key points</button>');
    b.addEventListener("click",()=>{ res.hidden=false;res.innerHTML='A good answer covers:<ul class="qmiss">'+open.points.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'; });
    act.appendChild(b); }
  if(st.open&&st.open.score!=null)show(st.open);
  return box; }
function renderPathFinish(){ const w=document.createElement("div");
  let right=0,of=0,got=0,pts=0;
  PATH.forEach(s=>{ const sc=stepScore(s);if(!sc)return; right+=sc.right;of+=sc.of; if(sc.open){got+=sc.open.score;pts+=sc.open.of;} });
  const done=pathDone();
  const h=head("step","Finished",done>=PATH.length?"You walked the whole request flow":"Your score so far",false,"",done+" of "+PATH.length+" steps done.");
  h.appendChild(pathBar());w.appendChild(h);
  const k=document.createElement("div");k.className="kpis";
  k.appendChild(el('<div class="kpi"><span class="val">'+right+' / '+of+'</span><span class="lab">questions right</span></div>'));
  if(pts)k.appendChild(el('<div class="kpi"><span class="val">'+got+' / '+pts+'</span><span class="lab">key points explained</span></div>'));
  w.appendChild(k);
  const rows=PATH.map((s,i)=>({s,i,sc:stepScore(s)}));
  const weak=rows.filter(x=>!stepDone(x.s)||(x.sc&&(x.sc.right<x.sc.of||(x.sc.open&&x.sc.open.score<x.sc.open.of))));
  const sec=sectionEl(weak.length?"Worth another look":"Every step",(weak.length?weak:rows).length);
  (weak.length?weak:rows).forEach(({s,i,sc})=>{
    const sub=!stepDone(s)?"Not finished":(sc?sc.right+" of "+sc.of+" right"+(sc.open?" · "+sc.open.score+" of "+sc.open.of+" key points":""):"No quiz");
    sec._list.appendChild(item({kind:"step",name:(i+1)+". "+s.title,sub,sans:true,onClick:()=>goStep(i+1)})); });
  w.appendChild(sec);
  const act=el('<div class="qact"></div>');
  const back=el('<button class="btn-main">Back to the overview</button>');back.addEventListener("click",()=>open({t:"overview"}));
  const again=el('<button class="ghlink">Start again</button>');again.addEventListener("click",()=>{ progress={steps:{},at:0};savePath();goStep(1); });
  act.append(back,again);w.appendChild(act);return w; }

// ---- navigation helpers (search palette + agent commands) ----
const lookup={stage:stageById,domain:domainById,tool:toolById,concern:concernById,store:storeById,infra:infraById};
function known(t){ if(!t||!t.t)return false; if(t.t==="overview")return true; if(t.t==="path")return PATH.length>0;
  if(lookup[t.t])return lookup[t.t].has(t.id); if(t.t==="area")return filesByArea.has(t.id); if(t.t==="file")return byPath.has(t.id); return false; }
function labelOf(t){ const x=lookup[t.t]&&lookup[t.t].get(t.id); return x?(x.title||x.name||x.label):t.t==="area"?t.id:undefined; }
function fileStack(path){ const f=byPath.get(path); markActive(keyOf({t:"area",id:f.area}));
  return [{kind:"area",ref:f.area,label:f.area},{kind:"file",ref:path,label:base(path)}]; }
function openFile(path){ if(!byPath.has(path))return; stack=fileStack(path); render(true); }
function openFunc(path,name){ if(!byPath.has(path))return; stack=[...fileStack(path),{kind:"function",file:path,fn:name,label:name}]; render(true); }
function openCode(path,ranges,note){ if(!byPath.has(path))return; stack=[...fileStack(path),codeFrame(path,ranges,note,false)]; render(true); }
function goto(t,label){ if(!known(t))return false; if(t.t==="file")openFile(t.id); else open(t,label||labelOf(t)); return true; }

// ---- focus bar: the question that moved the dashboard, suggestions, highlighted files ----
const focusEl=document.getElementById("focus");
const fstate={reason:"",suggest:null,note:""};
function paintFocus(){ focusEl.innerHTML="";
  const row=lbl=>{ const r=el('<div class="focus-row"><span class="focus-lbl">'+esc(lbl)+'</span></div>');focusEl.appendChild(r);return r; };
  if(fstate.reason)row("Asked").appendChild(el('<span class="focus-q">'+esc(fstate.reason)+'</span>'));
  if(fstate.suggest&&fstate.suggest.length){ const r=row("Did you mean");
    fstate.suggest.forEach(o=>{ const b=el('<button class="chip">'+esc(o.label)+'</button>');b.addEventListener("click",()=>goto(o.target,o.label));r.appendChild(b); }); }
  if(hl.size){ const r=row("In this answer");if(fstate.note)r.appendChild(el('<span>'+esc(fstate.note)+'</span>'));
    [...hl].forEach(p=>{ const rs=citedLines.get(p);
      const b=el('<button class="chip">'+esc(base(p)+(rs?" · "+rangesLabel(rs.slice(0,2)):""))+'</button>');b.title=p;
      b.addEventListener("click",()=>rs?openCode(p,rs,fstate.note):openFile(p));r.appendChild(b); }); }
  const first=focusEl.firstChild;
  if(first){ const x=el('<button class="focus-x" title="Clear" aria-label="Clear">&times;</button>');x.addEventListener("click",clearFocus);first.appendChild(x); }
  focusEl.hidden=!first; }
function paintHighlights(){ pbody.querySelectorAll("[data-path]").forEach(b=>b.classList.toggle("hl",hl.has(b.dataset.path))); }
function clearAsk(){ fstate.reason="";fstate.suggest=null;paintFocus(); }
function clearFocus(){ hl=new Set();citedLines=new Map();fstate.note="";clearAsk();paintHighlights(); }

// ---- live: commands pushed by `codesight serve` (prompt hook + agent MCP tools) ----
function onCommand(c){
  if(c.type==="open"){ if(goto(c.target,c.label)){ fstate.reason=c.reason||"";fstate.suggest=null;paintFocus(); } }
  else if(c.type==="suggest"){ fstate.reason=c.question||"";fstate.suggest=(c.options||[]).filter(o=>known(o.target));paintFocus(); }
  else if(c.type==="highlight"){ citedLines=new Map();
    (c.lines||[]).forEach(l=>{ if(!byPath.has(l.path))return; const a=Math.max(1,+l.start||1);
      if(!citedLines.has(l.path))citedLines.set(l.path,[]); citedLines.get(l.path).push([a,Math.max(a,+l.end||a)]); });
    hl=new Set([...(c.paths||[]),...citedLines.keys()].filter(p=>byPath.has(p)));fstate.note=c.note||"";paintFocus();paintHighlights(); }
  else if(c.type==="code"){ const rs=Array.isArray(c.ranges)&&c.ranges.length?c.ranges:[[+c.start||1,+c.end||+c.start||1]];
    openCode(c.path,rs.map(r=>{ const a=Math.max(1,+r[0]||1);return [a,Math.max(a,+r[1]||a)]; }),c.note||""); }
  else if(c.type==="diagram"){ if(c.mermaid)addUserDiagram({kind:c.kind,title:c.title||"Diagram",mermaid:c.mermaid}); }
  else if(c.type==="simple"){ if(c.analogy&&Array.isArray(c.steps))addUserDiagram({title:c.title||"In simple words",card:{analogy:c.analogy,steps:c.steps}}); }
}
if(LIVE){ const pill=document.getElementById("livepill");pill.hidden=false;
  const es=new EventSource("/events");
  es.onopen=()=>{ pill.classList.add("on");pill.textContent="live";sendPrefs(); };
  es.onerror=()=>{ pill.classList.remove("on");pill.textContent="reconnecting"; };
  es.onmessage=e=>{ let c;try{c=JSON.parse(e.data);}catch{return;} onCommand(c); }; }

// ---- learner picker ----
const picker=document.getElementById("picker"),learnerLabel=document.getElementById("learnerlabel");
const cap=s=>s[0].toUpperCase()+s.slice(1);
let draft=null;
function paintLearner(){ learnerLabel.textContent=cap(prefs.style)+" · "+cap(prefs.level); }
function paintPicker(){ picker.querySelectorAll(".pk-row").forEach(r=>r.querySelectorAll(".pk-opt").forEach(b=>b.classList.toggle("on",draft[r.dataset.k]===b.dataset.v))); }
function pickerOpen(){ draft={...prefs};paintPicker();picker.hidden=false;document.getElementById("pk-done").focus(); }
function pickerClose(save){ picker.hidden=true; if(!save)return;
  prefs={...draft};prefsChosen=true;try{localStorage.setItem(LEARNER_KEY,JSON.stringify(prefs));}catch{}
  document.documentElement.dataset.style=prefs.style;document.documentElement.dataset.level=prefs.level;
  paintLearner();sendPrefs();render(false); }
// Tell `codesight serve`, so the agent answers in the same style (get_overview + the prompt hook).
function sendPrefs(){ if(!LIVE||!prefsChosen)return; fetch("/api/learner",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({style:prefs.style,level:prefs.level})}).catch(()=>{}); }
picker.querySelectorAll(".pk-row").forEach(r=>r.addEventListener("click",e=>{ const b=e.target.closest(".pk-opt");if(!b)return;draft[r.dataset.k]=b.dataset.v;paintPicker(); }));
document.getElementById("pk-done").addEventListener("click",()=>pickerClose(true));
picker.addEventListener("click",e=>{ if(e.target===picker)pickerClose(!savedPrefs); });
document.getElementById("learnerbtn").addEventListener("click",pickerOpen);
paintLearner();

// ---- search palette (Cmd+K or /): instant, local, no AI ----
const pal=document.getElementById("pal"),palIn=document.getElementById("pal-in"),palList=document.getElementById("pal-list");
let palItems=null,palRes=[],palSel=0;
function palIndex(){ if(palItems)return palItems; palItems=[];
  // bonus: at an equal match, sections rank above files, files above symbols
  const add=(kind,name,sub,go,bonus)=>palItems.push({kind,name,sub:sub||"",go,bonus,n:name.toLowerCase(),b:base(name).toLowerCase(),s:(sub||"").toLowerCase()});
  DATA.tools.forEach(t=>add("tool",t.name,t.summary,()=>open({t:"tool",id:t.id},t.name),6));
  if(DATA.hasArch)DATA.spine.forEach(x=>add("stage",x.title,x.blurb,()=>open({t:"stage",id:x.id},x.title),6));
  DATA.domains.forEach(d=>add("domain",d.name,d.summary,()=>open({t:"domain",id:d.id},d.name),5));
  DATA.concerns.forEach(c=>add("concern",c.label,c.detail,()=>open({t:"concern",id:c.id},c.label),5));
  DATA.stores.forEach(x=>add("store",x.label,x.detail,()=>open({t:"store",id:x.id},x.label),4));
  DATA.files.forEach(f=>{ add("file",f.path,f.summary,()=>openFile(f.path),2);
    f.functions.forEach(d=>add("function",d.name,f.path,()=>openFunc(f.path,d.name),0));
    f.classes.forEach(d=>add("class",d.name,f.path,()=>openFunc(f.path,d.name),0)); });
  return palItems; }
function palScore(it,w){ if(it.b===w||it.n===w)return 100; if(it.b.startsWith(w))return 70; if(it.n.includes(w))return 45; if(it.s.includes(w))return 12; return 0; }
function palSearch(q){ const ws=q.toLowerCase().split(/\s+/).filter(Boolean); if(!ws.length)return [];
  const out=[]; for(const it of palIndex()){ let sc=0; for(const w of ws){ const x=palScore(it,w); if(!x){sc=0;break;} sc+=x; } if(sc)out.push([sc+it.bonus,it]); }
  return out.sort((a,b)=>b[0]-a[0]).slice(0,40).map(x=>x[1]); }
function palPaint(){ palList.innerHTML="";
  if(!palRes.length){ palList.appendChild(el('<div class="pal-empty">'+(palIn.value.trim()?"No matches.":"Type to search files, functions, tools, stages and domains.")+'</div>'));return; }
  palRes.forEach((it,i)=>{ const b=document.createElement("button");b.className="pal-row"+(i===palSel?" sel":"");
    b.innerHTML='<span class="item-marker m-'+it.kind+'"></span><span class="pal-name">'+esc(it.name)+'</span><span class="pal-sub">'+esc(it.sub)+'</span><span class="pal-kind">'+it.kind+'</span>';
    b.addEventListener("click",()=>palGo(it));b.addEventListener("mousemove",()=>{ if(palSel!==i){palSel=i;palMark();} });palList.appendChild(b); }); }
function palMark(){ [...palList.children].forEach((c,i)=>c.classList.toggle("sel",i===palSel)); const x=palList.children[palSel]; if(x)x.scrollIntoView({block:"nearest"}); }
function palOpen(){ pal.hidden=false;palIn.value="";palRes=[];palSel=0;palPaint();palIn.focus(); }
function palClose(){ pal.hidden=true; }
function palGo(it){ palClose();clearAsk();it.go(); }
palIn.addEventListener("input",()=>{ palRes=palSearch(palIn.value.trim());palSel=0;palPaint(); });
palIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palRes.length-1,palSel+1);palMark();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palMark();}
  else if(e.key==="Enter"){ if(palRes[palSel])palGo(palRes[palSel]); }
  else if(e.key==="Escape")palClose(); });
pal.addEventListener("click",e=>{ if(e.target===pal)palClose(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!picker.hidden){ pickerClose(!savedPrefs);return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault();pal.hidden?palOpen():palClose(); }
  else if(e.key==="/"&&pal.hidden&&!/^(input|textarea)$/i.test(document.activeElement.tagName)){ e.preventDefault();palOpen(); } });
document.getElementById("searchbtn").addEventListener("click",palOpen);

paintPathRail();
open({t:"overview"});
if(!savedPrefs)pickerOpen(); // first visit: ask how they learn
// Warm the diagram engine once the page is idle, so "Draw this" never waits on the download.
(window.requestIdleCallback||(f=>setTimeout(f,300)))(()=>{ loadMermaid().catch(()=>{}); if(LIVE)loadHljs().catch(()=>{}); });
</script>
